services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    ports:
      - "5672:5672" # AMQP protocol
      - "15672:15672" # Management UI
      - "15692:15692" # Prometheus metrics
    environment:
      # The built-in `guest` account is restricted to loopback, so it cannot be
      # used from the worker containers. Declare a real user instead.
      RABBITMQ_DEFAULT_USER: media
      RABBITMQ_DEFAULT_PASS: media
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # Durable queues are a headline lesson here -- without this volume,
      # `docker compose down` would silently discard queued jobs.
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - media_pipeline_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console UI
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Bucket events → Lambda functions. Each webhook target posts the S3 event
      # JSON to the Lambda runtime's invoke URL. The queue dir persists events
      # while a function is unreachable and resends them once it is back.
      MINIO_NOTIFY_WEBHOOK_ENABLE_METADATA: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_METADATA: http://fn-metadata:8080/2015-03-31/functions/function/invocations
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_METADATA: /data/.events/metadata
      MINIO_NOTIFY_WEBHOOK_ENABLE_PLACEHOLDER: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PLACEHOLDER: http://fn-placeholder:8080/2015-03-31/functions/function/invocations
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_PLACEHOLDER: /data/.events/placeholder
    depends_on:
      - fn-metadata
      - fn-placeholder
    volumes:
      - minio_data:/data
    networks:
      - media_pipeline_net
    healthcheck:
      # The image has no curl; `mc ready` is bundled and is MinIO's own advice.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - media_pipeline_net
    # `&&`, not `;` -- a failed alias or bucket creation must fail the container
    # instead of exiting 0 and leaving the pipeline without its buckets.
    # `--ignore-existing` keeps re-runs idempotent.
    # media-outputs is public-read (local dev only) so the browser UI can load
    # thumbnails and HLS straight from MinIO, which allows CORS by default.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/media-uploads &&
      mc mb --ignore-existing local/media-outputs &&
      mc anonymous set download local/media-outputs &&
      mc event add --ignore-existing local/media-uploads arn:minio:sqs::METADATA:webhook --event put &&
      mc event add --ignore-existing local/media-outputs arn:minio:sqs::PLACEHOLDER:webhook --event put --suffix image/full.webp
      "

  # Lambda functions, run locally in AWS's own Lambda image (Runtime Interface
  # Emulator on :8080). One image, the handler picked by `command`. MinIO bucket
  # events invoke them; nothing else calls them.
  fn-metadata:
    build: ./functions
    command: ["dist/metadata.handler"]
    environment: &function-env
      S3_ENDPOINT: http://minio:9000 # local only; on AWS the SDK finds S3 by region
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    networks:
      - media_pipeline_net

  fn-placeholder:
    build: ./functions
    command: ["dist/placeholder.handler"]
    environment: *function-env
    networks:
      - media_pipeline_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - media_pipeline_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  redisinsight:
    image: redis/redisinsight:3.8
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - media_pipeline_net

  prometheus:
    image: prom/prometheus:v3.13.2
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # Lets Prometheus scrape the API, which runs on the host under tsx.
      - "host.docker.internal:host-gateway"
    networks:
      - media_pipeline_net

  grafana:
    image: grafana/grafana:13.0.6
    ports:
      - "3001:3000" # Shifted to 3001: the host-run Fastify API owns 3000.
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - media_pipeline_net

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686" # Web UI
      - "4318:4318" # OpenTelemetry OTLP/HTTP receiver
    networks:
      - media_pipeline_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # No `container_name`: the service must stay scalable (--scale worker=N).
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s
    # The worker fails fast when its AMQP channel dies instead of re-opening it
    # in-process; the broker redelivers anything unacked and this brings it back.
    restart: unless-stopped
    environment:
      # Keys must match src/config exactly -- every one has a default, so a
      # typo here fails silently by falling back to a localhost URL.
      - NODE_ENV=development
      - AMQP_URL=amqp://media:media@rabbitmq:5672
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - BUCKET_UPLOADS=media-uploads
      - BUCKET_OUTPUTS=media-outputs
      - REDIS_URL=redis://redis:6379
      - WORKER_METRICS_PORT=9101
      - MAX_ATTEMPTS=3
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=media-worker
    volumes:
      # Narrow mounts on purpose: mounting the project root would shadow the
      # image's Linux node_modules with the host's macOS build of sharp.
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    networks:
      - media_pipeline_net

volumes:
  rabbitmq_data:
  minio_data:
  redis_data:
  redisinsight_data:
  prometheus_data:
  grafana_data:

networks:
  media_pipeline_net:
    name: media_pipeline_net
