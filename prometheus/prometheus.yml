global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "api"
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: "worker"
    dns_sd_configs:
      - names: ["worker"]
        type: "A"
        port: 9101
